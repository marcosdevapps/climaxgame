name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm todavía no existe en este punto: lo activa corepack en el paso siguiente.
          package-manager-cache: false

      - name: Activar pnpm (versión de packageManager)
        run: corepack enable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formato
        run: pnpm format:check

      - name: Tests unitarios
        run: pnpm test

      - name: Tests de base de datos (RLS, triggers, RPC)
        run: pnpm test:db

      # La home y la búsqueda se prerenderizan leyendo el catálogo público.
      # URL y clave publicable son públicas por diseño (van en el bundle del navegador; RLS protege los datos).
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jqbdjfkcrabkivlmtkdf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_VaPqd5tXCBuslPjJyLFEnA_Xi6Gf87P
          NEXT_PUBLIC_SITE_URL: https://climaxgame.vercel.app

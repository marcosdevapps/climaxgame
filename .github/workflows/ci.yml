name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Activar pnpm (versión de packageManager)
        run: corepack enable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formato
        run: pnpm format:check

      - name: Tests unitarios
        run: pnpm test

      - name: Tests de base de datos (RLS, triggers, RPC)
        run: pnpm test:db

      - name: Build
        run: pnpm build
